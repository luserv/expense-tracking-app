<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0b0b0f; color: #e5e5ea;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none;
  }
  .wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, #0a84ff, #34c1ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 800; color: #fff;
    box-shadow: 0 10px 36px rgba(10, 132, 255, .35);
  }
  .title { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .15);
    border-top-color: #34c1ff;
    animation: spin .8s linear infinite;
  }
  .status { font-size: 13px; color: #8a8a95; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">C</div>
    <div class="title">Chiro</div>
    <div class="spinner"></div>
    <div class="status" id="status">Cargando…</div>
  </div>
</body>
</html>
